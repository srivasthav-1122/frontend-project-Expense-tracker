```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <h1>Expense Tracker</h1>

            <p>Login to manage your money</p>


            <form id="loginForm">


                <!-- EMAIL -->

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <!-- ROLE -->

                <label for="loginRole">
                    Select Role
                </label>

                <select id="loginRole" required>

                    <option value="">
                        Select Role
                    </option>

                    <option value="user">
                        User
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- MESSAGE -->

            <p
                id="loginMessage"
                class="auth-message"
            ></p>


            <!-- SIGNUP -->

            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </div>

        </div>

    </div>


    <!-- AUTHENTICATION JAVASCRIPT -->

    <script src="auth.js"></script>

</body>

</html>
```
