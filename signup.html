```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Sign Up</title>

    <!-- Existing CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <h1>Create Account</h1>

            <p>Sign up for Expense Tracker</p>

            <form id="signupForm">

                <!-- NAME -->
                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    required
                >


                <!-- EMAIL -->
                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->
                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    required
                >


                <!-- CONFIRM PASSWORD -->
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <!-- SIGN UP BUTTON -->
                <button type="submit" class="login-btn">
                    Sign Up
                </button>

            </form>


            <!-- MESSAGE -->
            <p id="signupMessage" class="auth-message"></p>


            <!-- LOGIN LINK -->
            <div class="signup-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <!-- Authentication JavaScript -->
    <script src="auth.js"></script>

</body>

</html>
```
